name = "ai-gateway"
main = "worker.js"
compatibility_date = "2026-07-01"

[vars]
# One entry per project. Fields:
#   origins      — Origin allowlist for the project's pages ([] = allow all;
#                  keep localhost entries for testing built sites locally)
#   apiBase      — OpenAI-compatible endpoint the key belongs to
#                  (no /chat/completions suffix)
#   model        — pinned server-side; clients cannot choose another
#   keySecret    — name of the Worker secret holding the API key
#                  (`npx wrangler secret put KEY_GEMINI`); one secret per
#                  provider account, shared by any number of projects
#   maxBodyBytes — optional request size cap (default 80000)
# App projects (phone apps, no Origin) add:
#   credits      — { free, dailyCap, registrationsPerIpPerDay }: the ledger
#                  lives in the LEDGER D1 database (migrations/)
#   appKeySecret — Worker secret the app must present as X-App-Key
#   providers    — ordered [{apiBase, model, keySecret}]; a rate-limited or
#                  down provider falls through to the next
PROJECTS = '''
{
  "hisab": {
    "credits": { "free": 300, "dailyCap": 60, "registrationsPerIpPerDay": 5 },
    "appKeySecret": "APPKEY_HISAB",
    "maxBodyBytes": 400000,
    "providers": [
      { "apiBase": "https://api.deepseek.com", "model": "deepseek-chat", "keySecret": "KEY_DEEPSEEK" },
      { "apiBase": "https://api.groq.com/openai/v1", "model": "llama-3.3-70b-versatile", "keySecret": "KEY_GROQ" },
      { "apiBase": "https://generativelanguage.googleapis.com/v1beta/openai", "model": "gemini-3.5-flash", "keySecret": "KEY_GEMINI" }
    ]
  },
  "draftsmith": {
    "origins": [
      "https://vedants01.github.io",
      "http://localhost:8000",
      "http://127.0.0.1:8000"
    ],
    "apiBase": "https://generativelanguage.googleapis.com/v1beta/openai",
    "model": "gemini-3.5-flash",
    "keySecret": "KEY_GEMINI"
  }
}
'''

# Credits ledger for app projects. Create once: `npx wrangler d1 create
# ai-gateway-ledger`, paste its id here, then `./gateway migrate`.
[[d1_databases]]
binding = "LEDGER"
database_name = "ai-gateway-ledger"
database_id = "00000000-0000-0000-0000-000000000000"
